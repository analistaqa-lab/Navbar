name: E2E Storybook - MH-183

on:
  push:
    branches: ["main", "master", "develop", "release/**", "feature/**", "feat/**"]
  pull_request:
    branches: ["*"]
  workflow_dispatch:

jobs:
  e2e-storybook:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Create .env
        run: |
          cp .env.example .env
          echo "BASE_URL=http://127.0.0.1:6006" >> .env

      - name: Start Storybook
        run: npx storybook dev -p 6006 --ci > storybook.log 2>&1 &

      - name: Wait for Storybook
        run: npx wait-on http://127.0.0.1:6006

      - name: Run BDD tests
        run: npm test

      - name: Generate Allure report
        if: always()
        run: npm run allure:generate

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results
          if-no-files-found: warn

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report
          if-no-files-found: warn

      - name: Upload Storybook log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: storybook-log
          path: storybook.log
          if-no-files-found: warn
